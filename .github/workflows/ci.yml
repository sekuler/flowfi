name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the code and runs checks; it never needs to write to the repo.
permissions:
  contents: read

jobs:
  contracts:
    name: Contract tests (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git --no-commit

      - name: Run tests
        run: forge test -vv

      - name: Check contracts compile cleanly
        run: forge build --sizes

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        # Blocking: lint has 0 errors now (warnings don't fail the run).
        run: npm run lint

      - name: Build
        # Catches what tsc alone misses (bundling, imports, Vite config) before Vercel does.
        run: npm run build
