name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contract tests (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git --no-commit

      - name: Run tests
        run: forge test -vv

      - name: Check contracts compile cleanly
        run: forge build --sizes

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint (non-blocking for now)
        # continue-on-error rather than a hard gate: this is the lint
        # setup's first time in CI, and the existing codebase has ~15
        # pre-existing findings (mostly minor) that predate this workflow
        # step. Failing the build on those right now would block unrelated
        # PRs on cleanup that has nothing to do with them. Once those are
        # addressed, drop continue-on-error here so lint actually gates
        # merges instead of just reporting.
        run: npm run lint
        continue-on-error: true
