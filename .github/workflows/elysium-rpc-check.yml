name: Elysium RPC check

# Checks both Elysium RPCs used by src/components/ElysiumBridge.tsx. A failed run sends an email.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check RPCs
        run: |
          call() {
            curl -sS --max-time 15 -X POST "$1" -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$2\",\"params\":[]}" | jq -er '.result'
          }
          failed=0
          for rpc in https://rpc.styxn.fun https://rpc-live.elysp.com; do
            chain=$(call "$rpc" eth_chainId) || chain=""
            first=$(call "$rpc" eth_blockNumber) || first=""
            sleep 10
            second=$(call "$rpc" eth_blockNumber) || second=""
            if [ "$chain" = "0x1863d" ] && [ -n "$first" ] && [ -n "$second" ] && [ $((second)) -gt $((first)) ]; then
              echo "OK: $rpc block $((second))"
            else
              echo "::error::$rpc failed (chain=$chain first=$first second=$second)"
              failed=1
            fi
          done
          exit $failed
